server_name _;

charset utf8;

client_max_body_size 0;

root /usr/share/jitsi-meet;

# ssi on with javascript for multidomain variables in config.js
ssi on;
ssi_types application/x-javascript application/javascript;

index index.html index.htm;
error_page 404 /static/404.html;

# Security headers
add_header X-Content-Type-Options nosniff;
add_header X-XSS-Protection "1; mode=block";
add_header Content-Security-Policy "tmpl" always;

set $prefix "";

add_header X-Jitsi-Shard tmpl;

# Opt out of FLoC (deprecated)
add_header Permissions-Policy "interest-cohort=()";

include /run/web/config/nginx-custom/*.conf;

location = /config.js {
 alias /run/web/config/config.js;
}

location = /interface_config.js {
 alias /run/web/config/interface_config.js;
}

location = /external_api.js {
 alias /usr/share/jitsi-meet/libs/external_api.min.js;
}

location = /_api/room-info {
 proxy_pass tmpl/room-info?prefix=$prefix&$args;
 proxy_http_version 1.1;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_set_header Host $http_host;
}

# ensure all static content can always be found first
location ~ ^/(libs|css|static|images|fonts|lang|sounds|connection_optimization|.well-known|transcripts)/(.*)$ {
 add_header 'Access-Control-Allow-Origin' 'tmpl';
 alias /usr/share/jitsi-meet/$1/$2;

 # cache all versioned files
 if ($arg_v) {
 expires 1y;
 }
}

# BOSH
location = /http-bind {
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_set_header Host tmpl;

 proxy_pass tmpl/http-bind?prefix=$prefix&$args;
}

# xmpp websockets
location = /xmpp-websocket {
 tcp_nodelay on;

 proxy_http_version 1.1;
 proxy_set_header Connection $connection_upgrade;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Host tmpl;
 proxy_set_header X-Forwarded-For $remote_addr;

 proxy_pass tmpl/xmpp-websocket?prefix=$prefix&$args;
}

# Etherpad-lite
location ^~ /etherpad/ {
 proxy_buffering off;
 proxy_cache_bypass $http_upgrade;

 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "upgrade";
 proxy_set_header X-Forwarded-For $remote_addr;

 proxy_pass tmpl/;
}

# rtcstats websockets
location = /rtcstats-ws/ {
 tcp_nodelay on;

 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "upgrade";
 proxy_set_header X-Forwarded-For $remote_addr;

 proxy_pass tmpl/;
}

# rtc-visualizer
location = /tmpl {
 return 301 $scheme://$http_host$request_uri/;
}

location ^~ /tmpl/ {
 tcp_nodelay on;

 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "upgrade";
 proxy_set_header X-Forwarded-For $remote_addr;

 proxy_pass tmpl/;
}

# whiteboard (excalidraw-backend)
location = /socket.io/ {
 proxy_buffering off;
 proxy_cache_bypass $http_upgrade;

 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "upgrade";
 proxy_set_header X-Forwarded-For $remote_addr;

 proxy_pass tmpl/socket.io/?$args;
}

location ~ ^/([^/?&:'"]+)$ {
 try_files $uri @root_path;
}

location @root_path {
 rewrite ^/(.*)$ / break;
}

 # Matches /(TENANT)/pwa-worker.js or /(TENANT)/manifest.json to rewrite to / and look for file
 location ~ ^/([^/?&:'"]+)/(pwa-worker.js|manifest.json)$ {
 set $subdomain "$1.";
 set $subdir "$1/";
 rewrite ^/([^/?&:'"]+)/(pwa-worker.js|manifest.json)$ /$2;
 }

 location ~ ^/([^/?&:'"]+)/config.js$ {
 set $subdomain "$1.";
 set $subdir "$1/";

 alias /run/web/config/config.js;
 }

 # BOSH for subdomains
 location ~ ^/([^/?&:'"]+)/http-bind {
 set $subdomain "$1.";
 set $subdir "$1/";
 set $prefix "$1";

 rewrite ^/(.*)$ /http-bind;
 }

 # websockets for subdomains
 location ~ ^/([^/?&:'"]+)/xmpp-websocket {
 set $subdomain "$1.";
 set $subdir "$1/";
 set $prefix "$1";

 rewrite ^/(.*)$ /xmpp-websocket;
 }

 location ~ ^/([^/?&:'"]+)/_api/room-info {
 set $subdomain "$1.";
 set $subdir "$1/";
 set $prefix "$1";

 rewrite ^/(.*)$ /_api/room-info;
 }

 # load test minimal client, uncomment when used
 location ~ ^/_load-test/([^/?&:'"]+)$ {
 rewrite ^/_load-test/(.*)$ /load-test/index.html break;
 }
 location ~ ^/_load-test/libs/(.*)$ {
 add_header 'Access-Control-Allow-Origin' 'tmpl';
 alias /usr/share/jitsi-meet/load-test/libs/$1;
 }

 # load-test for subdomains
 location ~ ^/([^/?&:'"]+)/_load-test/([^/?&:'"]+)$ {
 set $subdomain "$1.";
 set $subdir "$1/";
 set $prefix "$1";

 rewrite ^/(.*)$ /load-test/index.html break;
 }

 # load-test for subdomains
 location ~ ^/([^/?&:'"]+)/_load-test/libs/(.*)$ {
 set $subdomain "$1.";
 set $subdir "$1/";
 set $prefix "$1";

 alias /usr/share/jitsi-meet/load-test/libs/$2;
 }

 # Anything that didn't match above, and isn't a real file, assume it's a room name and redirect to /
 location ~ ^/([^/?&:'"]+)/(.*)$ {
 set $subdomain "$1.";
 set $subdir "$1/";
 rewrite ^/([^/?&:'"]+)/(.*)$ /$2;
 }
