events {
    worker_connections 64;
}

http {
    server {
        listen 80;
        location / {
            # Safe for CRLF: $request_uri is not URL-decoded the same way as $uri
            proxy_pass http://backend$request_uri;
            proxy_set_header X-Request-URI $request_uri;
            proxy_set_header Host $host;
        }
    }
}
