events {
    worker_connections 64;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        # intentionally sensitive pattern for later rules
        location / {
            proxy_pass http://backend$uri;
            proxy_set_header Host $host;
        }

        location = /admin {
            return 403;
        }
    }
}
