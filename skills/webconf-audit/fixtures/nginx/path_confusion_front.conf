events {
    worker_connections 64;
}

http {
    server {
        listen 80;
        # Any HTTP reverse-proxy to Apache is enough for the chain risk
        # (decode-then-normalize vs Apache ≥2.4.49 normalize-first).
        location /tools/ {
            proxy_pass http://127.0.0.1:60080/;
        }
        location /index.php {
            proxy_pass http://127.0.0.1:60080;
        }
    }
}
