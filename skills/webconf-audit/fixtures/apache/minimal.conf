ServerRoot "/etc/httpd"
Listen 80

# missing on purpose for IncludeOptional
IncludeOptional conf.d/missing-optional.conf

<VirtualHost *:80>
    ServerName example.local
    DocumentRoot "/var/www/html"

    <Directory "/var/www/html">
        AllowOverride None
        Require all granted
    </Directory>

    Alias /icons/ "/usr/share/httpd/icons/"
    RewriteEngine On
    RewriteRule ^/old/(.*)$ /new/$1 [L,R=301]
</VirtualHost>
